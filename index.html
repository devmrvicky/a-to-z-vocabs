<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0c10" />
    <meta name="description" content="SSC A-Z Vocabulary Series — Complete Reference with Quiz Mode" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="style.css" />
    <title>SSC A–Z Vocabulary Series</title>
  </head>
  <body>

    <!-- HEADER -->
    <header>
      <div class="header-badge">SSC Exams 2026</div>
      <h1>A–Z Vocabulary Series</h1>
      <p>Complete Reference · Hindi Meanings · SSC-Relevant Synonyms</p>
    </header>

    <!-- SECTION TABS -->
    <div class="section-tabs" id="sectionTabs">
      <button class="section-tab active" data-section="vocabs">📖 Vocabulary</button>
      <button class="section-tab" data-section="syns">🔄 Synonyms &amp; Antonyms</button>
      <button class="section-tab" data-section="ows">💡 One Word</button>
      <button class="section-tab" data-section="idioms">🗣️ Idioms</button>
      <button class="section-tab" data-section="quiz">🧠 Quiz</button>
    </div>

    <!-- CONTROLS BAR -->
    <div class="controls" id="controls">
      <div class="search-wrap">
        <input type="text" id="search" placeholder="Search word, meaning, synonym…" autocomplete="off" />
      </div>
      <div class="controls-right">
        <div class="difficulty-filters" id="difficultyFilters">
          <button class="filter-btn active" data-diff="all"    onclick="setDifficultyFilter('all',this)">All</button>
          <button class="filter-btn"        data-diff="easy"   onclick="setDifficultyFilter('easy',this)">Easy</button>
          <button class="filter-btn"        data-diff="medium" onclick="setDifficultyFilter('medium',this)">Medium</button>
          <button class="filter-btn"        data-diff="hard"   onclick="setDifficultyFilter('hard',this)">Hard</button>
        </div>
        <button class="filter-btn" id="filterToggleBtn" onclick="openFilterPanel()" style="display:none">⚙ Filters</button>
      </div>
    </div>

    <!-- ALPHABET BAR -->
    <div class="alphabet-filter" id="alphabetFilter"></div>

    <!-- WORD GRID -->
    <div class="grid" id="grid"></div>

    <!-- QUIZ PANEL -->
    <div id="quizSection" style="display:none;"></div>

    <footer>
      <p>Source: <strong>SSC Exams 2026 — A to Z Vocabulary by Sanjeev Thakur Sir (Rojgar with Ankit)</strong></p>
      <p style="margin-top:6px;font-size:11px;">CGL · CHSL · GD · MTS · CPO · Steno previous year papers</p>
    </footer>

    <!-- ADD WORD FAB -->
    <button class="fab" id="addWordFab" onclick="openAddWordForm()" title="Add new word">＋</button>

    <!-- GENERIC MODAL (injected by modal.js) -->

    <!-- SCRIPTS — order is load dependency order -->
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/modal.js"></script>
    <script src="js/bookmark.js"></script>
    <script src="js/search.js"></script>
    <script src="js/difficulty.js"></script>
    <script src="js/speech.js"></script>
    <script src="js/filters.js"></script>
    <script src="js/render.js"></script>
    <script src="js/data-loader.js"></script>
    <script src="js/word-editor.js"></script>
    <script src="js/section-tabs.js"></script>
    <script src="js/quiz-engine.js"></script>
    <script src="js/quiz-ui.js"></script>
    <script src="js/app.js"></script>
    <script>
      // Register service worker for PWA
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js')
          .catch(e => console.log('SW reg skipped:', e));
      }
    </script>
  </body>
</html>
